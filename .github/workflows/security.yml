name: Weekly security check

# New vulnerabilities are published for code nobody touched, and CI only looks when code
# changes. This checks every dependency this repository ships against the public advisory
# databases each Monday and whenever those dependencies change, and fails loudly: a red run,
# which GitHub emails to whoever last edited this schedule. GitHub pauses schedules in public
# repositories after 60 days without a commit; "Run workflow" on the Actions tab resumes it.
# Every pull request and push to main is also scanned for committed secrets.

on:
  schedule:
    - cron: "57 5 * * 1"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: the check reads code and public advisories; it writes nothing.
permissions:
  contents: read

jobs:
  changes:
    # The dependency checks run on the schedule, by hand, and on a pull request that changes what
    # they read; the secret scan runs on every event.
    runs-on: ubuntu-latest
    outputs:
      deps: ${{ steps.f.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          deps_paths='^(\.github/workflows/security\.yml|dashboard/package(-lock)?\.json|dashboard/scripts/audit-npm\.cjs|services/decisions/requirements\.txt|versions\.env)$'
          case "$EVENT" in
            push) deps=false ;;
            pull_request) deps=$(git diff --name-only "$BASE"...HEAD | grep -Eq "$deps_paths" && echo true || echo false) ;;
            *) deps=true ;;
          esac
          echo "deps=$deps" >> "$GITHUB_OUTPUT"

  dashboard:
    name: Dashboard dependencies
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.11.1"

      # package.json overrides minimatch to 11 (GHSA-g3hv-75wg-m249; no eslint or openapi-typescript
      # release has it yet). eslint and typescript-eslint use only its named exports;
      # @redocly/openapi-core calls it as a function only when it fetches a remote URL, which
      # scripts/api-types.mjs never does (it passes parsed documents). Drop the override once they catch up.
      - name: npm packages, moderate advisories and above
        working-directory: dashboard
        # audit-npm.cjs is `npm audit --audit-level=moderate` minus the advisories it names with a reason.
        run: node scripts/audit-npm.cjs

  decisions:
    name: Decisions sidecar dependencies
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pinned packages
        # The exact pins only: resolving them would download the full PyTorch build. The optional
        # sidecar pins its model runtime to the checkpoint it was verified with, so its findings
        # are reviewed by hand: they show here without turning the run red.
        continue-on-error: true
        run: |
          python -m pip install --quiet pip-audit==2.10.1
          grep -E '^[A-Za-z0-9_.-]+==' services/decisions/requirements.txt > "$RUNNER_TEMP/decisions.txt"
          pip-audit --no-deps --disable-pip --progress-spinner off -r "$RUNNER_TEMP/decisions.txt"

  images:
    name: Released images
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    env:
      # Trivy 0.75.0, pinned by digest like every image an owner runs.
      TRIVY: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@v7

      - name: Conker's own images, as versions.env pins them
        # Each image's Linux and Python packages. Only problems that already have a fix fail the
        # run: rebuilding or updating clears them, so each one is something to act on.
        run: |
          pin() { sed -n "s/^$1=//p" versions.env; }
          status=0
          for image in pi:"$(pin PI_VERSION)" toolgate:"$(pin TOOLGATE_VERSION)" \
              memorygate:"$(pin MEMORYGATE_VERSION)" systemgate:"$(pin SYSTEMGATE_VERSION)" \
              embeddings:"$(pin EMBEDDINGS_VERSION)"; do
            echo "::group::ghcr.io/conker-ai/$image"
            docker run --rm -v trivy-cache:/root/.cache "$TRIVY" image --quiet --scanners vuln \
              --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 \
              "ghcr.io/conker-ai/$image" || status=1
            echo "::endgroup::"
          done
          # The Claude plan runtime, once a release pins it by digest.
          subscriptions=$(pin SUBSCRIPTIONS_IMAGE)
          if [ -n "$subscriptions" ]; then
            echo "::group::$subscriptions"
            docker run --rm -v trivy-cache:/root/.cache "$TRIVY" image --quiet --scanners vuln \
              --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$subscriptions" || status=1
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Third-party images, as versions.env pins them
        # Their fixes are upstream; a finding here means moving that digest to a fixed release.
        # Runs even when Conker's own images failed, so one run shows everything.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          pin() { sed -n "s/^$1=//p" versions.env; }
          status=0
          for key in POSTGRES_IMAGE QDRANT_IMAGE OLLAMA_IMAGE SEARXNG_IMAGE; do
            echo "::group::$(pin "$key")"
            docker run --rm -v trivy-cache:/root/.cache "$TRIVY" image --quiet --scanners vuln \
              --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$(pin "$key")" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a pull request is scanned for its own commits, everything else for all of them.
          fetch-depth: 0

      - name: Scan
        # gitleaks 8.28.0, pinned by digest; the default rules and the false positives .gitleaks.toml
        # names. --verbose lists each finding (file, line, commit, rule) with its value redacted.
        env:
          GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="--log-opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range=""
          fi
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS" git /repo --config /repo/.gitleaks.toml --log-level debug --no-banner --redact --verbose --exit-code 1 $range
