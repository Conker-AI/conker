name: Release page

# A pushed tag vX.Y.Z publishes a GitHub Release whose body is that version's CHANGELOG section.
# Installed servers read the latest one anonymously (`conker update --check`) and offer it in the
# Inbox. The tag, CONKER_VERSION in versions.env and the CHANGELOG heading must agree, or nothing
# is published (scripts/release_notes.py).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Release notes from CHANGELOG.md
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Publish the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --latest
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
              --title "Conker ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
