name: Dashboard

on:
  pull_request:
    paths: ["dashboard/**", ".github/workflows/dashboard.yml", "scripts/workspace-sources.json", "README.md", "scripts/check_quickstart.py"]
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard.yml", "scripts/workspace-sources.json", "README.md", "scripts/check_quickstart.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # The generated API types must match the Pi this Conker pins (scripts/workspace-sources.json).
      - name: Pinned Pi
        id: pin
        run: echo "pi=$(jq -r .pi ../scripts/workspace-sources.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Conker-AI/pi
          ref: ${{ steps.pin.outputs.pi }}
          path: pinned-pi
          sparse-checkout: |
            docs
            pi/conversation
      - name: API types match the pinned Pi
        env:
          PI_DOCS: ${{ github.workspace }}/pinned-pi/docs
        run: npm run api:types:check
      # Pi teaches models the catalog the dashboard draws; the pinned copy must be this catalog's prompt.
      - name: Interactive answers catalog matches the pinned Pi
        env:
          PI_SOURCE: ${{ github.workspace }}/pinned-pi
        run: npm run answer-ui:prompt:check
      - run: npm run lint
      - run: npm run design:check:test
      - run: npm run build
      - run: npm run check
      # Chat, approval and forget clicked through in Chromium against the preview gateway.
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      # The README preview lines, run as written; fails unless the page is up within five minutes.
      - name: README quickstart
        run: python3 ../scripts/check_quickstart.py --run
      - name: End-to-end report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            dashboard/playwright-report
            dashboard/test-results
          retention-days: 7
