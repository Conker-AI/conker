name: CI

# The installer's promises are testable, so they are tested. A rule nobody
# checks is a rule that decays — the same reason each module's contract is
# enforced in its own CI rather than described in its README.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI checks code; nothing here writes to the repository or packages.
permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet -r requirements-dev.txt

      - name: Pinned releases
        # The compatibility fixture is the ToolGate release Conker ships (versions.env), so the
        # two cannot drift apart.
        id: pins
        run: echo "toolgate=v$(sed -n 's/^TOOLGATE_VERSION=//p' versions.env)" >> "$GITHUB_OUTPUT"

      - name: ToolGate compatibility fixture
        uses: actions/checkout@v7
        with:
          repository: Conker-AI/toolgate
          ref: ${{ steps.pins.outputs.toolgate }}
          path: .test-gates/toolgate

      - name: Shell syntax
        # Catches an unterminated quote before it becomes a broken install on
        # someone else's machine.
        run: |
          bash -n install.sh
          bash -n conker

      - name: Release compatibility manifest
        run: python scripts/release_manifest.py --check

      - name: Capability contract
        run: python scripts/validate_capabilities.py

      - name: File sizes
        # 600 lines per source file; files that were already larger may only shrink.
        run: python scripts/check_file_sizes.py

      - name: Python lint
        run: python -m ruff check scripts tests

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning install.sh conker

      - name: Line endings must be LF
        # A CRLF in a shell script is a "bad interpreter" failure that nothing
        # on a Windows machine surfaces before it reaches a server.
        run: |
          if git grep -Il $'\r' -- . ; then
            echo "CRLF found in tracked files; .gitattributes should normalise these." >&2
            exit 1
          fi
          echo "all tracked text files are LF"

      - name: The installer keeps its promises
        # Docker is present on this runner, and the suite only ever uses its
        # read-only verbs — `info` and `compose config`. Nothing is pulled and
        # nothing is started.
        env:
          CONKER_TEST_TOOLGATE: ${{ github.workspace }}/.test-gates/toolgate
        run: python -m pytest tests/ -q

      - name: Browser deployment and recovery mutation drill
        run: python scripts/auth_mutation_drill.py

  recovery-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements-dev.txt
      - name: Restore real stores without an action-capable process or network
        env:
          CONKER_RECOVERY_DOCKER: "1"
        run: python -m pytest tests/test_recovery_docker.py -q

  subscription-runtime:
    # The Claude plan runtime the source-built server layout builds (services/subscriptions): the
    # image builds, the pinned Claude Code binary passes its checksum and runs read-only, signed
    # out, and the bridge answers only with its keys. Nothing signs in.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -f services/subscriptions/Dockerfile -t conker-subscriptions:ci .

      - name: Claude Code runs without a network
        run: |
          docker run --rm --network none --read-only conker-subscriptions:ci \
            /opt/claude/bin/claude --version

      - name: The bridge starts, signed out, and keeps its keys apart
        run: |
          control=ci-control-key-ci-control-key-ci-control
          inference=ci-inference-key-ci-inference-key-ci-inf
          docker run -d --name subscriptions --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m --tmpfs /state:rw,uid=1000,gid=1000 \
            -e SUBSCRIPTIONS_CONTROL_KEY="$control" -e SUBSCRIPTIONS_INFERENCE_KEY="$inference" \
            conker-subscriptions:ci
          probe='import sys, urllib.request as u
          request = u.Request("http://127.0.0.1:8070" + sys.argv[1], headers={"Authorization": "Bearer " + sys.argv[2]})
          try:
              print(u.urlopen(request, timeout=20).read().decode())
          except u.HTTPError as error:
              print(error.code)'
          for _ in $(seq 30); do
            docker exec subscriptions python -c "$probe" /health x && break
            sleep 1
          done
          status=$(docker exec subscriptions python /app/subscription_runtime.py status)
          echo "$status"
          echo "$status" | python3 -c 'import json, sys; value = json.load(sys.stdin); assert value["available"] is True and value["connected"] is False, value'
          test "$(docker exec subscriptions python -c "$probe" /inference/claude/status "$control")" = 401
          docker exec subscriptions python -c "$probe" /inference/claude/status "$inference" \
            | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"available": True, "connected": False}'
          # No host ChatGPT worker here, so ChatGPT is honestly unavailable.
          docker exec subscriptions python -c "$probe" /inference/status "$inference" \
            | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"available": False, "connected": False}'

      - name: Runtime logs
        if: always()
        run: docker logs subscriptions || true

  cross-gate:
    # The tests that import Pi, ToolGate and MemoryGate together, run against the gate commits
    # Conker pins (scripts/workspace-sources.json). Run only by hand, they once rotted for weeks
    # because every one of them skips when a gate is missing; here a skip fails the job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: conker

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pinned gates
        id: pins
        run: |
          for gate in pi toolgate memorygate; do
            echo "$gate=$(jq -r ".$gate" conker/scripts/workspace-sources.json)" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/checkout@v7
        with:
          repository: Conker-AI/pi
          ref: ${{ steps.pins.outputs.pi }}
          path: gates/pi

      - uses: actions/checkout@v7
        with:
          repository: Conker-AI/toolgate
          ref: ${{ steps.pins.outputs.toolgate }}
          path: gates/toolgate

      - uses: actions/checkout@v7
        with:
          repository: Conker-AI/memorygate
          ref: ${{ steps.pins.outputs.memorygate }}
          path: gates/memorygate

      - name: Install every gate's pins
        # One interpreter for all three. They agree on every shared pin except a cryptography patch
        # release, so they are installed in turn rather than resolved together.
        run: |
          pip install --quiet -r conker/requirements-dev.txt
          pip install --quiet -r gates/pi/requirements.txt
          pip install --quiet -r gates/memorygate/services/api/requirements.txt
          pip install --quiet -r gates/toolgate/toolgate/requirements.txt

      - name: Cross-gate contracts
        # From Conker's root, so its tests import scripts.* as they do locally.
        working-directory: conker
        env:
          PYTHONPATH: ${{ github.workspace }}/gates/pi:${{ github.workspace }}/gates/toolgate:${{ github.workspace }}/gates/memorygate/services/api
          CONKER_TEST_TOOLGATE: ${{ github.workspace }}/gates/toolgate
          CONKER_TEST_PI_SOURCE: ${{ github.workspace }}/gates/pi
        run: |
          set -o pipefail
          python -m pytest -q -rs -p no:cacheprovider             tests/test_memory_authority_contract.py             tests/test_scheduled_budget_contract.py             tests/test_settings_registry_contract.py             tests/test_workflow_drafts_contract.py             tests/test_recovery_reconciliation.py             tests/test_subscription_continuation.py             "tests/test_recovery.py::test_current_toolgate_rejects_restored_approval"             "tests/test_recovery.py::test_restored_vault_opens_with_actual_toolgate"             ../gates/memorygate/integrations/test_pi_memory.py | tee pytest.out
          if grep -q "^SKIPPED" pytest.out; then
            echo "::error::A cross-gate test skipped; every one must run here."
            exit 1
          fi
