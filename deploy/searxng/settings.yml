# SearXNG for ToolGate's web search: internal only (no published port), JSON answers on.
# The defaults allow only the html format, so ToolGate's JSON search got 403.
# No secret here: the container makes a random one at each start (docker-compose.yml).
use_default_settings: true
general:
  enable_metrics: false
search:
  safe_search: 1
  autocomplete: ""
  formats: [html, json]
server:
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"
